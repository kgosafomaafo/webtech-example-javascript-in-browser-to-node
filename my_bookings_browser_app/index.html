<!DOCTYPE html>
<!-- Author: KGOsafoMaafo@gmail.com
	About: This is a simple client side only code that demonstrates use of HTML with JavaScript, JSON with fetch
-->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Booking Checker</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			max-width: 600px;
			margin: 40px auto;
			padding: 0 16px;
			color: #222;
		}

		.slot {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 12px;
			margin: 10px 0;
			border: 1px solid #ddd;
			border-radius: 8px;
		}

		.slot img {
			width: 32px;
			height: 32px;
		}

		button {
			margin-left: auto;
			padding: 8px 12px;
			cursor: pointer;
		}

		#message {
			color: #555;
		}
		
		.logo { float: left}
	</style>
</head>
<body>
	<h1>Booking Page<img class="logo" src="favicon-32x32.png"></img></h1>
	<p id="message">Loading bookings...</p>
	
	<button name="getBookings" type="button" onClick="loadBookings()">Get Bookings</button>
	
	<div id="booking-list"></div>
	<script>
		const bookingList = document.getElementById("booking-list");
		const message = document.getElementById("message");

		// images for the app
		const imageBookingOpen = "no.jpg";

		const imageBookingFilled = "yes.jpg";
		
		const imageBookingLogo = "favicon-32x32.png";

		function showBookings(bookings) {
			bookingList.innerHTML = "";

			bookings.forEach(function (booking) {
				const row = document.createElement("div");
				row.className = "slot";

				const image = document.createElement("img");
				image.src = booking.booked ? imageBookingFilled : imageBookingOpen;
				image.alt = booking.booked ? "Booked" : "Open";

				const text = document.createElement("span");
				text.textContent =
					booking.time + " — " + (booking.booked ? "Booked" : "Open");

				row.appendChild(image);
				row.appendChild(text);

				if (!booking.booked) {
					const button = document.createElement("button");
					button.textContent = "Book";
					button.onclick = function () {
						booking.booked = true;
						showBookings(bookings);
						message.textContent =
							"Booking shown for this demo. It hasn’t been saved to a server.";
					};
					row.appendChild(button);
				}

				bookingList.appendChild(row);
			});
		}
	
	function loadBookings()
	{
		fetch("bookings.json")
			.then(function (response) {
			if (!response.ok) {
				throw new Error("Could not load bookings.");
			}
			return response.json();
			})
			.then(function (bookings) {
			message.textContent = "Choose an open time:";
			showBookings(bookings);
			})
			.catch(function (error) {
			message.textContent = error.message;
			});
	}
	</script>
</body>
</html>
